name: Build, Deploy & Enterprise Live E2E Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BASE_URL: https://charan5287.github.io/pdd/
  HEADLESS: "true"
  BROWSER: "chrome"

jobs:
  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      # Stage 1: Repository Checkout
      - name: Stage 1 — Repository Checkout
        uses: actions/checkout@v4

      # Stage 2: Dependency Installation (Node)
      - name: Stage 2 — Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'pdd/web/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd pdd/web
          npm ci

      # Stage 3: Build Application
      - name: Stage 3 — Build React Application
        run: |
          cd pdd/web
          npm run build

      # Stage 4: Static Analysis
      - name: Stage 4 — Static Analysis & Asset Audit
        run: |
          echo "Auditing build output artifacts in pdd/web/dist..."
          ls -la pdd/web/dist

      # Stage 5: Upload Pages Artifact & Deploy to GitHub Pages
      - name: Stage 5 — Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pdd/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-and-test:
    name: Live Deployment Verification & Master E2E Testing Suite
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      # Stage 1: Repository Checkout
      - name: Stage 1 — Repository Checkout
        uses: actions/checkout@v4

      # Stage 2: Dependency Installation (Python, Selenium, Appium, Chrome)
      - name: Stage 2 — Setup Python, Headless Chrome & Appium Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Automation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt
          pip install Appium-Python-Client

      # Stage 6: Wait for Deployment
      - name: Stage 6 — Wait for GitHub Pages Deployment Propagation
        run: |
          echo "Waiting 15 seconds for GitHub Pages DNS & asset propagation..."
          sleep 15

      # Stage 7: Deployment Verification
      - name: Stage 7 — Deployment Health Check & Asset Verification
        run: |
          python automation/utils/verify_deployment.py "${{ env.BASE_URL }}"

      # Stage 8-10: Execute All 6 Test Suites (1,800 Test Cases) & Generate 6 Separate Excel Reports
      - name: Stage 8-10 — Execute Master E2E Suite (1,800 Tests) & Generate Separate Excel Reports
        run: |
          python automation/run_all_suites.py

      # Stage 11: Upload Artifacts
      - name: Stage 11 — Upload All 6 Excel Workbooks & HTML Dashboards as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MediNow-Enterprise-Master-Test-Reports
          path: |
            Test Results/
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30

      # Stage 12: Publish Summary
      - name: Stage 12 — Publish Execution Summary to Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      # Stage 13: Store Historical Results
      - name: Stage 13 — Store Historical Test Run Evidence
        if: always()
        run: |
          mkdir -p automation/history
          cp "Test Results/JSON/execution-results.json" "automation/history/run-$(date +'%Y%m%d_%H%M%S').json" || true
